# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build

on:
  push:
    branches: [ "26.2" ]
  pull_request:
    branches: [ "26.2" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew setup

    - name: Build RoastMC (NeoForge)
      run: ./gradlew roastmcJar

    - name: Build RoastMC (Fabric)
      run: ./gradlew fabricJar

    - name: Build unified RoastMC jar
      run: ./gradlew roastmcAllJar

    - name: Upload NeoForge build
      uses: actions/upload-artifact@v6
      with:
        name: RoastMC-NeoForge-26.2-server
        path: projects/roastmc/build/libs/*-server.jar

    - name: Upload Fabric build
      uses: actions/upload-artifact@v6
      with:
        name: RoastMC-Fabric-26.2-server
        path: fabric/build/libs/*-server.jar

    - name: Upload unified build
      uses: actions/upload-artifact@v6
      with:
        name: RoastMC-All-26.2-server
        path: multiloader/build/libs/*-all.jar
