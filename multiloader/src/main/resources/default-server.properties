# RoastMC default server.properties. Edit this file in the source to change what NEW servers start with,
# then rebuild. It is only used when a server has no server.properties yet.
# Keys not listed here get Minecraft's normal defaults on first start.

# Loader selection (see the docs): neoforge+paper, fabric, or neoforge+fabric (experimental)
neoforge=true
fabric=false
paper=true

# Common settings
motd=A RoastMC Server
max-players=20
difficulty=easy
gamemode=survival
online-mode=true
view-distance=10
simulation-distance=10
server-port=25565
